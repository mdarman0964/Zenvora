name: Zenvora Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: zenvora-release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure persistent signing key (or temporary test key if secrets are not configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/zenvora-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PATH" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "SIGNING_MODE=persistent" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/zenvora-release-test.jks" \
              -storepass zenvoraTestOnly \
              -keypass zenvoraTestOnly \
              -alias zenvora \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Zenvora Test, OU=Android, O=Zenvora, L=Unknown, ST=Unknown, C=US"
            printf 'storeFile=%s\nstorePassword=zenvoraTestOnly\nkeyAlias=zenvora\nkeyPassword=zenvoraTestOnly\n' "$RUNNER_TEMP/zenvora-release-test.jks" > keystore.properties
            echo "SIGNING_MODE=temporary-test" >> "$GITHUB_ENV"
            echo "::warning::Persistent signing secrets are missing. This APK uses a temporary key and cannot update an APK signed with a different key."
          fi

      - name: Build compact ARM64 release APK
        run: ./gradlew :app:assembleGenericRelease -PnoSplits --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/generic/release -maxdepth 1 -type f -name '*.apk' -exec cp {} release-apks/ \;
          test -n "$(find release-apks -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenvora-Release-APK
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="zenvora-build-${GITHUB_RUN_NUMBER}"
          if [[ "$SIGNING_MODE" == "persistent" ]]; then
            NOTES="Automatically built from commit ${GITHUB_SHA}. ARM64 APK signed with the configured persistent Zenvora signing key."
          else
            NOTES="Automatically built from commit ${GITHUB_SHA}. ARM64 test APK signed with a temporary key because persistent signing secrets are not configured. It cannot update APKs signed with another key."
          fi
          gh release create "$TAG" release-apks/*.apk \
            --title "Zenvora Release Build ${GITHUB_RUN_NUMBER}" \
            --notes "$NOTES"
